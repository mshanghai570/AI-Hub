# AI Hub — iOS app target
#
# This file is the source of truth for the Xcode project. `ios/AIHub.xcodeproj`
# is generated from it by XcodeGen, so the project file itself is gitignored and
# never hand-edited — change this file, then re-run `./ios/scripts/build-ipa.sh`
# (or `xcodegen generate --spec ios/project.yml --project ios`).
#
# Signing is deliberately left at automatic/none here so the project opens in
# Xcode and runs on a device with your own team. The unsigned sideloading build
# disables signing on the xcodebuild command line instead, so that this project
# stays usable for normal Xcode development.

name: AIHub

options:
  bundleIdPrefix: com.aihub
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  # Keep the build directory out of the repo.
  generateEmptyDirectories: false

settings:
  base:
    # Swift 5 language mode: avoids strict-concurrency isolation churn in the
    # WebKit + SwiftUI glue while still compiling with the Swift 6 toolchain.
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  AIHub:
    type: application
    platform: iOS
    sources:
      - path: AIHub
    settings:
      base:
        PRODUCT_NAME: AIHub
        PRODUCT_BUNDLE_IDENTIFIER: com.aihub.app
        INFOPLIST_FILE: AIHub/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        # Assets.xcassets is picked up automatically from the `AIHub` sources
        # path; the app icon art is generated by scripts/make-app-icon.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # No entitlements file: the app needs no special capabilities, only
        # outbound networking, which is unrestricted on iOS (unlike macOS App
        # Sandbox). Keeping this empty also keeps the IPA easy to re-sign.
        CODE_SIGN_ENTITLEMENTS: ""
    # No test target yet — see the follow-up notes in the hand-off summary.

schemes:
  AIHub:
    build:
      targets:
        AIHub: all
    run:
      config: Debug
    archive:
      config: Release
